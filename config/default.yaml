app:
  name: "Pi Ambient Synth"
  log_level: "INFO"
  state_path: "./state/current_patch.json"
  favorites_path: "./state/favorites.json"
  marker_dir: "/var/lib/pi-ambient-synth"

monitor:
  enabled: true
  host: "0.0.0.0"
  port: 8080
  journal_lines: 22
  log_tail_lines: 35
  # Pi headless: numpy sigil render can SIGBUS — use placeholder PNG
  skip_sigil: true
  # No periodic page/API reload (0 = off)
  auto_refresh_seconds: 0

midi:
  preferred_input_keywords:
    - "KeyStep"
    - "Arturia"
  channel: null
  fallback_to_first_available: true
  # KeyStep Shift is often CC 63; Play/Stop are MMC start/stop (handled) or CC below.
  shift_cc: 63
  shift_cc_threshold: 64
  transport_cc:
    play: [102]
    stop: [103]
    record: [104]
  weather_cc: 1
  favorite_recall_window_ms: 600
  split_note: 55
  # KeyStep MPE often sends ch 15 (mido ch=14) with velocity < 20 — floor before OSC.
  velocity_floor: 72
  sigils_dir: "./state/sigils"
  export_sigil_on_reseed: true

osc:
  supercollider_host: "127.0.0.1"
  supercollider_port: 57120
  python_listen_port: 57121

audio:
  # Pi production: set /etc/pi-ambient-synth/audio-mode.conf to AUDIO_MODE=flues
  backend: "supercollider"  # supercollider | flues | direct_keys
  default_volume: 0.85
  patch_morph_seconds: 6.0

patch:
  seed: null
  default_seed: 1001
  evolve_enabled: false
  reseed_mode: "curated"
  default_scale_family: "ambient_modal"

pisugar:
  enabled: true
  socket_path: "/tmp/pisugar-server.sock"
  tcp_host: "127.0.0.1"
  tcp_port: 8423
  command_timeout_seconds: 2.0
  poll_seconds: 90
  charge_poll_seconds: 5
  show_on_display: true

eink:
  enabled: true
  width: 250
  height: 122
  rotate: 0
  update_on_reseed: true
  partial_refresh: true
  full_refresh_boot: false
  show_text_labels: true
  show_playing_note: true
  note_refresh_seconds: 0.5
  clear_on_shutdown: false

visual:
  style: "topographic"
  margin: 8
  line_count_min: 9
  line_count_max: 28
  include_patch_name: true
  include_scale_name: true
